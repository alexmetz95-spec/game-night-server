# Render Blueprint for Game Night multiplayer WebSocket server
# Deploy: Render Dashboard -> New -> Blueprint -> connect repo containing this file
services:
  - type: web
    name: game-night-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
